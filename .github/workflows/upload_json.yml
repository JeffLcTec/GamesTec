name: Run Python Script Every 20 Minutes

on:
  schedule:
    - cron: "*/20 * * * *"

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v2

      - name: Configurar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'  # Ajusta a la versión de Python que requieras

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin requests

      - name: Run Python script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "arqui-a68cb-firebase-adminsdk-wvdaf-5b49548963.json"
        run: python nombre_del_archivo.py

